[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-agent"
version = "0.1.1"
description = "Auditable daily A-share research and paper trading; no live execution"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=19", "duckdb>=1.2,<2", "PyYAML>=6", "pydantic>=2.10,<3", "python-dotenv>=1", "httpx>=0.28,<1", "tushare>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
ashare = "ashare_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashare_agent = ["web/*.html", "calendars/*.json", "calendars/raw/*.html", "calendars/raw/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
